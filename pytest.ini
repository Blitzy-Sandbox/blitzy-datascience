[pytest]
# =============================================================================
# pytest.ini — Test Runner Configuration for Gate 10
# =============================================================================
# Purpose
# -------
# This file is the single authoritative pytest configuration for the NBA Data
# Ingestion Pipeline. It binds the following Validation Gates from the product
# brief (`docs/New_Product_Prompt_20260418.md` §6):
#
#   Gate 10 — Test Execution Binding:
#     A single command (`python -m pytest tests/`) MUST run all unit AND
#     integration tests. Integration tests that hit the live API MUST be
#     marked with `@pytest.mark.integration` and skippable via
#     `pytest -m "not integration"`.
#
#   Gate 2  — Zero-warning build / clean lint (reinforced by filterwarnings).
#
# Note on section name
# --------------------
# The correct section header for a `pytest.ini` file is `[pytest]`. The
# alternative forms `[tool:pytest]` (setup.cfg) and `[tool.pytest.ini_options]`
# (pyproject.toml) are NOT valid here.
# =============================================================================

# -----------------------------------------------------------------------------
# Discovery
# -----------------------------------------------------------------------------
# `testpaths` tells pytest where to look for tests when no paths are given on
# the command line. This makes `python -m pytest` (with no args) behave the
# same as `python -m pytest tests/` — satisfying the Gate 10 "single command"
# clause.
testpaths = tests

# Test file / class / function naming patterns. The values below are the
# pytest defaults; they are spelled out so the contract is explicit and so
# that no surprise is introduced if the pytest defaults change in a future
# major release.
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# -----------------------------------------------------------------------------
# Markers
# -----------------------------------------------------------------------------
# Every marker used anywhere in the `tests/` tree MUST be registered here —
# the `--strict-markers` flag below turns any unregistered marker into a hard
# error. This is a Gate 10 defense: if a contributor typos `@pytest.mark.integraiton`
# pytest will fail loudly rather than silently exclude that test from the
# default run.
markers =
    integration: marks tests that hit the live NBA Stats API and require network access (deselect with -m "not integration")
    invariant: marks tests that assert project-wide invariants via grep or DataFrame properties (Rules 1, 4, 7)

# -----------------------------------------------------------------------------
# Default command-line options
# -----------------------------------------------------------------------------
# Applied to every pytest invocation, local or automated:
#   -ra                Short summary of every test outcome except plain passes.
#                      Surfaces skips/xfails/errors that would otherwise be
#                      hidden in a large test suite.
#   --strict-markers   Unknown markers cause the collection to fail (see above).
#   --strict-config    Unknown ini-file keys cause pytest to fail fast, so a
#                      stale or mistyped key does not silently lose effect.
addopts = -ra --strict-markers --strict-config

# -----------------------------------------------------------------------------
# Warning filters
# -----------------------------------------------------------------------------
# Policy: treat every warning as an error by default (aligned with Gate 2's
# "zero warnings" ethos). Each `ignore::` line below is a tightly scoped
# downgrade for an upstream-controlled warning we cannot fix in this codebase.
# Do NOT add blanket `ignore::Warning` clauses — they defeat the purpose.
filterwarnings =
    error
    # pandas 2.x surfaces occasional deprecation / future warnings for behavior
    # slated for pandas 3.0. These originate inside pandas itself; we filter
    # only warnings whose source module matches the `pandas.*` hierarchy.
    ignore::DeprecationWarning:pandas.*
    ignore::FutureWarning:pandas.*
    # urllib3 (a requests transitive dep) emits InsecureRequestWarning only
    # when TLS verification is disabled; we never disable verification, but
    # the warning class itself may be triggered by transitive fixtures in
    # integration tests that probe connectivity.
    ignore::urllib3.exceptions.InsecureRequestWarning

# -----------------------------------------------------------------------------
# Logging integration
# -----------------------------------------------------------------------------
# Pytest's log-capture subsystem mirrors the format used by `utils/logger.py`
# so that log lines surfaced on test failure are visually consistent with
# production logs. `log_cli = False` keeps the default test output clean;
# pytest shows captured logs only for failing tests, or when the operator
# explicitly opts in with `--log-cli-level=...`.
log_cli = False
log_level = INFO
log_format = %(asctime)s %(levelname)s %(name)s %(message)s
log_date_format = %Y-%m-%dT%H:%M:%S
